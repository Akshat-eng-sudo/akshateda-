[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akshat"
version = "0.1.0"
description = "A Python package for automated exploratory data analysis"
readme = "README.md"
authors = [{name = "Akshat", email = "your.email@example.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.6"
dependencies = [
    "pandas>=1.0.0",
    "numpy>=1.18.0",
    "matplotlib>=3.2.0",
    "seaborn>=0.10.0",
    "scipy>=1.4.0",
    "scikit-learn>=0.22.0",
    "termcolor>=1.1.0"
]
keywords = ["eda", "data-analysis", "exploratory-data-analysis", "data-science"]

[project.urls]
Homepage = "https://github.com/akshateda/akshat"
Repository = "https://github.com/akshateda/akshat.git"
Documentation = "https://github.com/akshateda/akshat"